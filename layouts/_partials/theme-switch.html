{{- $isZh := eq .Site.Language.Lang "zh-cn" -}}
<button type="button" class="menu-item theme-switch" title="{{ T "switchTheme" }}" aria-label="{{ T "switchTheme" }}"
    data-label-auto="{{ if $isZh }}跟随系统。切换为浅色{{ else }}System theme. Switch to light{{ end }}"
    data-label-light="{{ if $isZh }}浅色模式。切换为深色{{ else }}Light theme. Switch to dark{{ end }}"
    data-label-dark="{{ if $isZh }}深色模式。切换为跟随系统{{ else }}Dark theme. Switch to system{{ end }}">
    <svg class="theme-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
        <g class="theme-icon-state theme-icon-auto"><rect x="3.5" y="4.5" width="17" height="12" rx="2"/><path d="M8 20h8m-4-3.5V20"/></g>
        <g class="theme-icon-state theme-icon-light"><circle cx="12" cy="12" r="3.5"/><path d="M12 2.5v2m0 15v2M2.5 12h2m15 0h2M5.3 5.3l1.4 1.4m10.6 10.6 1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"/></g>
        <g class="theme-icon-state theme-icon-dark"><path d="M20.9 13.3A9 9 0 0 1 10.7 3.1 9 9 0 1 0 20.9 13.3Z"/></g>
    </svg>
</button>
